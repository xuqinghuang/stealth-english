<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>widget</title>
<link rel="icon" href="data:,">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; user-select:none; }

  /* 这里不能用 -webkit-app-region: drag。wry 会打开 WebView2 的非客户区支持，
     该属性会把整窗变成"标题栏"：鼠标移动事件不再派发给页面，CSS :hover 卡在最后一次
     状态不再更新（表现：悬停显示的中文/底部控制栏一旦出现就永不消失）。
     拖动由 bridge/api.js 的 mousedown → widget_drag 实现，不依赖 CSS。 */
  #widget {
    position:absolute; top:0; left:0; width:100%;
    font-size:15px; line-height:1.55;
    border-radius:10px;
    transition:opacity .55s ease, background .3s;
    --wcolor:#fff;
    --wcolor-2:rgba(255,255,255,.68);
    --whalo:0 0 3px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.8);
  }

  /* 模式一：伪装成系统通知卡片 */
  #widget.mode-card {
    padding:11px 14px 9px;
    background:rgba(28,31,36,.78);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 14px 44px rgba(0,0,0,.38);
  }
  /* 模式二：纯文字（几乎隐形） */
  #widget.mode-text { padding:6px 10px; background:none; border:none; box-shadow:none; }
  #widget.mode-text .w-titlebar { display:none; }
  /* 模式三：字幕条 */
  #widget.mode-sub {
    padding:10px 18px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.06);
  }
  #widget.mode-sub .w-titlebar { display:none; }

  .w-titlebar { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .w-app {
    font-size:11px; color:rgba(255,255,255,.5);
    display:flex; align-items:center; gap:6px;
    outline:none; border-radius:4px; padding:1px 4px; margin-left:-4px;
  }
  .w-app:hover { background:rgba(255,255,255,.08); }
  .w-ico { width:12px; height:12px; border-radius:3px; background:linear-gradient(135deg,#4f8cff,#38bdf8); display:inline-block; flex:none; }
  #appTitle { outline:none; max-width:250px; white-space:nowrap; overflow:hidden; }
  .w-time { font-size:11px; color:rgba(255,255,255,.35); }

  .w-en { color:var(--wcolor); text-shadow:var(--whalo); }
  .w-cn { color:var(--wcolor-2); font-size:.88em; margin-top:2px; transition:opacity .3s; text-shadow:var(--whalo); }

  #widget.cn-always .w-cn { opacity:1; }
  #widget.cn-hover .w-cn { opacity:0; }
  #widget.cn-hover:hover .w-cn { opacity:1; }
  #widget.cn-off .w-cn { display:none; }

  .w-bar { display:flex; justify-content:space-between; align-items:center; margin-top:8px; opacity:0; transition:opacity .25s; }
  #widget:hover .w-bar { opacity:1; }
  .w-progress { font-size:11px; color:var(--wcolor-2); text-shadow:var(--whalo); }
  .w-book { font-size:10.5px; color:var(--wcolor-2); max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:var(--whalo); }
  .w-ctrl { display:flex; gap:2px; }
  .w-ctrl button {
    background:none; border:none; color:var(--wcolor); font-size:13px;
    cursor:pointer; padding:3px 6px; border-radius:5px; line-height:1;
    text-shadow:var(--whalo);
  }
  .w-ctrl button:hover { background:rgba(255,255,255,.14); color:var(--wcolor); }
  .w-ctrl .cn-btn { font-size:11px; font-weight:600; border:1px solid var(--wcolor-2); border-radius:5px; padding:2px 6px; }

  .w-empty { color:var(--wcolor-2); font-size:13px; padding:8px 0; text-shadow:var(--whalo); }

  /* 句子里的每个单词。不能加 app-region，拖动一律走 bridge 的 startDrag */
  .w-en .w-word { cursor:pointer; border-radius:3px; }
  .w-en .w-word:hover { background:rgba(255,255,255,.16); }
  .w-en .w-word.w-hit { background:rgba(120,170,255,.34); }

  /* 查词卡：排在英文句**上方**，靠窗口向上生长把整张卡显示出来。
     窗口画不到自己外面，所以卡片不能做成绝对定位的浮层——那样会被裁掉。
     向上长的关键在 Rust 侧 widget_resize 的 anchor='bottom'：拖过窗口之后窗口默认是
     左上角固定、向下长，卡片会把原文顶下去；底边锚定才能让原文一动不动。
     宽度上限由 JS 按 widgetMaxWidth 写进 style，免得把窗口撑得比用户设的上限还宽。
     卡片自带深色底，不跟随正文颜色：正文可能是白字配亮桌面，卡片必须有稳定对比。 */
  .w-dict {
    margin-bottom:8px; padding:9px 11px 10px;
    background:rgba(18,20,24,.95);
    border:1px solid rgba(255,255,255,.13);
    border-radius:8px;
    box-shadow:0 8px 26px rgba(0,0,0,.42);
    text-shadow:none; font-size:13px; line-height:1.5;
  }
  .wd-head { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .wd-word { font-size:15px; font-weight:600; color:#fff; }
  .wd-phon { font-size:12px; color:rgba(255,255,255,.58); }
  .wd-tools { margin-left:auto; flex:none; display:flex; align-items:center; gap:3px; }
  .wd-tools button { background:none; border:none; cursor:pointer; padding:0 3px; color:rgba(255,255,255,.5); }
  .wd-tools button:hover { color:#fff; }
  .wd-say { font-size:12px; }
  .wd-close { font-size:14px; line-height:1; }
  .wd-proto { font-size:11.5px; color:rgba(255,255,255,.5); margin-top:3px; }
  .wd-tr { display:flex; gap:6px; margin-top:5px; align-items:baseline; }
  .wd-pos { flex:none; min-width:28px; color:#8fb8ff; font-style:italic; font-size:12px; }
  .wd-means { color:rgba(255,255,255,.9); }
  .wd-load { font-size:12px; color:rgba(255,255,255,.5); }
  .wd-fail { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:#ff9b9b; }
  .wd-fail button { background:none; border:1px solid rgba(255,155,155,.5); border-radius:4px; color:#ff9b9b; cursor:pointer; padding:1px 7px; font-size:12px; }
  .wd-fail button:hover { background:rgba(255,155,155,.14); }

  /* 窗口 resizable:false，拖右下角手柄来手动定尺寸（拖完切 manual 模式） */
  #wGrip {
    position:absolute; right:0; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; opacity:0;
  }
  #widget:hover #wGrip { opacity:1; }
  #wGrip::after {
    content:''; position:absolute; right:4px; bottom:4px; width:7px; height:7px;
    border-right:1.5px solid var(--wcolor-2);
    border-bottom:1.5px solid var(--wcolor-2);
    border-radius:0 0 3px 0;
  }
</style>
</head>
<body>
<div id="widget" class="mode-card cn-hover">
  <div class="w-titlebar">
    <span class="w-app" title="点击改名，伪装成任何通知"><span class="w-ico"></span><span id="appTitle" contenteditable="true" spellcheck="false">工作提醒</span></span>
    <span class="w-time" id="wTime"></span>
  </div>
  <div id="wBody">
    <div class="w-dict" id="wDict" style="display:none"></div>
    <div class="w-en" id="wEn"></div>
    <div class="w-cn" id="wCn"></div>
    <div class="w-empty" id="wEmpty" style="display:none">右键托盘 → 打开资料库，导入一篇文章开始练习</div>
  </div>
  <div class="w-bar">
    <span class="w-progress" id="wProgress"></span>
    <span class="w-book" id="wBook"></span>
    <span class="w-ctrl">
      <button id="btnPrev" title="上一句">⏮</button>
      <button id="btnPlay" title="播放/暂停">▶</button>
      <button id="btnNext" title="下一句">⏭</button>
      <button id="btnCn" class="cn-btn" title="中文：总是/悬停/隐藏">译</button>
      <button id="btnHide" title="隐藏（Alt+H 唤回）">✕</button>
    </span>
  </div>
  <div id="wGrip" title="拖拽调整大小"></div>
</div>

<script src="widget.js"></script>
</body>
</html>
